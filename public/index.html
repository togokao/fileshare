<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FileShare</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --text: #1f2328; --muted: #6b7280;
    --border: #d9dde3; --accent: #2563eb; --accent-soft: #e8efff; --danger: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --card: #1a1f25; --text: #e6e8eb; --muted: #9aa3ad;
      --border: #2d343c; --accent: #5b8def; --accent-soft: #1d2a42; --danger: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "PingFang TC", sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  .sub { margin: 0 0 24px; color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  .drop {
    border: 2px dashed var(--border); border-radius: 10px; padding: 32px 16px;
    text-align: center; cursor: pointer; transition: .15s;
  }
  .drop.over, .drop:hover { border-color: var(--accent); background: var(--accent-soft); }
  .drop strong { color: var(--accent); }
  .progress { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 14px; display: none; }
  .progress > div { height: 100%; width: 0; background: var(--accent); transition: width .1s; }
  .msg { margin-top: 10px; min-height: 1.5em; font-size: 14px; color: var(--muted); }
  .msg.err { color: var(--danger); }
  h2 { font-size: 17px; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; }
  h2 small { font-weight: normal; color: var(--muted); font-size: 13px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--border); }
  li:first-child { border-top: 0; }
  .info { flex: 1; min-width: 0; }
  .name { font-weight: 600; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 13px; }
  button {
    font: inherit; border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer;
    background: var(--accent); color: #fff; white-space: nowrap;
  }
  button:disabled { opacity: .5; cursor: default; }
  .empty { color: var(--muted); text-align: center; padding: 24px 0; }
</style>
</head>
<body>
<main>
  <h1>FileShare</h1>
  <p class="sub">上傳檔案，所有人都能看到並下載。檔案被下載一次後就會自動刪除。</p>

  <section class="card">
    <div class="drop" id="drop">
      <div><strong>點擊選擇檔案</strong> 或拖曳檔案到這裡</div>
      <div class="meta">可一次選擇多個檔案</div>
    </div>
    <input type="file" id="picker" multiple hidden>
    <div class="progress" id="progress"><div></div></div>
    <div class="msg" id="msg"></div>
  </section>

  <section class="card">
    <h2>可下載的檔案 <small id="count"></small></h2>
    <ul id="list"><li class="empty">載入中…</li></ul>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const drop = $('drop'), picker = $('picker'), list = $('list');
const bar = $('progress'), barFill = bar.firstElementChild, msg = $('msg');

function fmtSize(n) {
  const u = ['B', 'KB', 'MB', 'GB'];
  let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i ? n.toFixed(1) : n) + ' ' + u[i];
}
function fmtTime(t) {
  return new Date(t).toLocaleString('zh-TW', { hour12: false });
}
function setMsg(text, isErr) {
  msg.textContent = text;
  msg.className = 'msg' + (isErr ? ' err' : '');
}

async function refresh() {
  try {
    const files = await (await fetch('/api/files')).json();
    $('count').textContent = files.length ? `共 ${files.length} 個` : '';
    list.replaceChildren();
    if (!files.length) {
      list.innerHTML = '<li class="empty">目前沒有檔案</li>';
      return;
    }
    for (const f of files) {
      const li = document.createElement('li');
      const info = document.createElement('div');
      info.className = 'info';
      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = f.name;
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = `${fmtSize(f.size)} · ${fmtTime(f.uploadedAt)}`;
      info.append(name, meta);
      const btn = document.createElement('button');
      btn.textContent = '下載';
      btn.onclick = () => {
        btn.disabled = true;
        // Navigating to the URL triggers a normal browser download.
        window.location.href = '/api/download/' + f.id;
        setTimeout(refresh, 800);
      };
      li.append(info, btn);
      list.append(li);
    }
  } catch {
    list.innerHTML = '<li class="empty">無法載入檔案列表</li>';
  }
}

function uploadOne(file) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/upload');
    xhr.setRequestHeader('X-Filename', encodeURIComponent(file.name));
    xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
    xhr.upload.onprogress = e => {
      if (e.lengthComputable) barFill.style.width = (e.loaded / e.total * 100) + '%';
    };
    xhr.onload = () => {
      if (xhr.status === 201) return resolve();
      let err = '上傳失敗';
      try { err = JSON.parse(xhr.responseText).error || err; } catch {}
      reject(new Error(err));
    };
    xhr.onerror = () => reject(new Error('網路錯誤'));
    xhr.send(file);
  });
}

async function uploadAll(fileList) {
  const files = [...fileList];
  if (!files.length) return;
  bar.style.display = 'block';
  let ok = 0;
  for (const [i, f] of files.entries()) {
    barFill.style.width = '0';
    setMsg(`上傳中 (${i + 1}/${files.length})：${f.name}`);
    try { await uploadOne(f); ok++; }
    catch (e) { setMsg(`${f.name}：${e.message}`, true); await new Promise(r => setTimeout(r, 1500)); }
  }
  bar.style.display = 'none';
  setMsg(`完成，成功上傳 ${ok}/${files.length} 個檔案`, ok < files.length);
  picker.value = '';
  refresh();
}

drop.onclick = () => picker.click();
picker.onchange = () => uploadAll(picker.files);
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); uploadAll(e.dataTransfer.files); };

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
